  <text x="360" y="232" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Sync</text>
  <text x="360" y="286" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#dbe7ff">for Sheets</text>
