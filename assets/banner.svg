<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/><stop offset="1" stop-color="#0b57d0"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>
  <!-- grid -->
  <rect x="70" y="90" width="120" height="120" rx="12" fill="none" stroke="#fff" stroke-width="10"/>
  <g stroke="#fff" stroke-width="7">
    <line x1="70" y1="130" x2="190" y2="130"/><line x1="70" y1="170" x2="190" y2="170"/>
    <line x1="110" y1="90" x2="110" y2="210"/><line x1="150" y1="90" x2="150" y2="210"/>
  </g>
  <!-- db cylinder -->
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M250 108 v84 a42 16 0 0 0 84 0 v-84"/>
